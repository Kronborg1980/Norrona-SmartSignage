name = "norrona-smartsignage"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "signage-db"
# Replace after: npx wrangler d1 create signage-db
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "norrona-signage-media"
