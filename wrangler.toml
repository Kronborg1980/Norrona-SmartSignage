name = "norrona-smartsignage"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "signage-db"
# Cloudflare D1 database: signage-db
database_id = "6178685c-9a4f-4d6f-873c-5a8d45914910"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "norrona-signage-media"
